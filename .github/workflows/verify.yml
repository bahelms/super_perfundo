name: SuperPerfundo
on:
  pull_request:
    branches:
      - master

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          # Single source of truth: versions live in .tool-versions only, so CI
          # and local development cannot drift apart.
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test

      # The Rust MCTS agent behind the Quarto NIF was previously never exercised
      # by CI, despite being the least-covered code in the project.
      - name: Rust tests
        working-directory: native/quarto_ai
        run: cargo test
